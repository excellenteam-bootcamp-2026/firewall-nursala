services:
  postgres:
    image: postgres:16
    container_name: firewall-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: firewall_dev

    # Host port is overridable so the stack still comes up on a machine where
    # something else already owns 5432. Defaults to the standard port.
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"

    volumes:
      - firewall_postgres_data:/var/lib/postgresql/data

volumes:
  firewall_postgres_data: