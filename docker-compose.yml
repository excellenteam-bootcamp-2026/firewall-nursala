services:
  postgres:
    image: postgres:16
    container_name: firewall-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: firewall_dev

    ports:
      - "5432:5432"

    volumes:
      - firewall_postgres_data:/var/lib/postgresql/data

volumes:
  firewall_postgres_data: